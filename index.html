<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo</title>
<meta name="theme-color" content="#141A23">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDEFF3; --surface:#FFFFFF; --ink:#161B26; --muted:#5D6878; --line:#D6DBE3; --chip:#E2E6EC;
  --danger:#B4372F;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141A23; --surface:#1C2430; --ink:#E9EDF3; --muted:#95A2B3; --line:#2D3946; --chip:#26303D; --danger:#F07A70; color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#141A23; --surface:#1C2430; --ink:#E9EDF3; --muted:#95A2B3; --line:#2D3946; --chip:#26303D; --danger:#F07A70; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:18px 16px 130px}
.display{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-0.03em}
h1{font:800 clamp(2.4rem,10vw,3.4rem)/0.95 "Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-0.035em;margin:10px 0 6px}
.sub{color:var(--muted);margin:0 0 16px}
.search input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
.poster{position:relative;aspect-ratio:3/4;border:0;border-radius:16px;padding:14px;text-align:left;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.15) inset}
.poster::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 100% 0%,rgba(255,255,255,.22),transparent 60%);pointer-events:none}
.poster .t{font:800 1.55rem/1 "Bricolage Grotesque",sans-serif;letter-spacing:-0.03em;text-wrap:balance;position:relative;z-index:1}
.poster .m{font-size:.8rem;opacity:.85;margin-top:6px;position:relative;z-index:1}
.poster .big{position:absolute;top:6px;right:12px;font:800 4.2rem/1 "Bricolage Grotesque",sans-serif;opacity:.18;letter-spacing:-0.05em}
.poster.new{background:transparent;border:2px dashed var(--line);color:var(--muted);justify-content:center;align-items:center;text-align:center;box-shadow:none}
.poster.new::after{display:none}
.poster.new .t{font-size:1.1rem;color:var(--ink)}
.poster:focus-visible,.cell:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
/* series view */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:8px}
.back{border:0;background:var(--chip);border-radius:999px;padding:7px 14px;font-weight:500}
.hero{border-radius:22px;padding:22px 20px 20px;color:#fff;position:relative;overflow:hidden}
.hero h2{font:800 clamp(2.2rem,11vw,3.6rem)/0.92 "Bricolage Grotesque",sans-serif;letter-spacing:-0.04em;margin:0 0 8px}
.hero p{margin:0;opacity:.88;font-size:.92rem}
.hero .edit{position:absolute;top:14px;right:14px;border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:6px 12px;font-size:.82rem}
.map{margin:22px 0 8px}
.map h3,.section-h{font:700 1.1rem "Bricolage Grotesque",sans-serif;margin:0 0 10px;letter-spacing:-0.01em}
.srow{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.srow b{font:700 .9rem "Bricolage Grotesque",sans-serif;color:var(--muted);padding-top:4px}
.cells{display:flex;flex-wrap:wrap;gap:4px}
.cell{width:27px;height:27px;border-radius:7px;border:0;background:var(--chip);color:var(--muted);font-size:.68rem;font-variant-numeric:tabular-nums;padding:0}
.cell.on{background:var(--c);color:#fff;font-weight:600}
.cell.sel{outline:3px solid var(--ink);outline-offset:1px;color:var(--ink);font-weight:700;background:var(--surface)}
.dest{font-size:.88rem;background:var(--chip);border-radius:10px;padding:9px 12px;margin:0}
.dest.warn{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:14px;display:flex;gap:12px;align-items:center;z-index:20;max-width:92vw;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
.toast button{border:0;background:rgba(127,127,127,.3);color:inherit;border-radius:10px;padding:6px 12px;font-weight:600}
.legend{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.nomap{background:var(--surface);border-radius:14px;padding:14px;color:var(--muted);font-size:.92rem}
.nomap button{border:0;background:none;color:var(--ink);text-decoration:underline;padding:0}
.season-h{font:600 .85rem "IBM Plex Sans",sans-serif;color:var(--muted);margin:22px 0 8px}
.card{background:var(--surface);border-radius:18px;padding:16px 16px 14px;margin-bottom:10px;border-left:5px solid var(--c);scroll-margin-top:80px}
.card.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--c)}100%{box-shadow:0 0 0 0 transparent}}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:700 .78rem "IBM Plex Sans",sans-serif;background:var(--c);color:#fff;padding:3px 10px;border-radius:999px}
.ep{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;flex:1}
.ep i{font-family:"Newsreader",Georgia,serif;font-size:.95rem;color:var(--ink)}
.quote{font:italic 400 1.3rem/1.38 "Newsreader",Georgia,serif;margin:12px 0 6px;text-wrap:pretty}
.quote::before{content:"“"}.quote::after{content:"”"}
.quote.empty{font:400 .92rem "IBM Plex Sans",sans-serif;color:var(--muted)}
.quote.empty::before,.quote.empty::after{content:none}
.note{font-size:.88rem;color:var(--muted);margin:0 0 6px}
.time{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:8px}
.bar{position:relative;flex:1;height:5px;border-radius:3px;background:var(--chip);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--c);border-radius:3px;min-width:4px}
.icon{border:0;background:none;color:var(--muted);padding:6px 8px;border-radius:10px;font-size:1rem}
.icon:hover{background:var(--chip);color:var(--ink)}
.show-name{font:700 .95rem "Bricolage Grotesque",sans-serif}
.fab{position:fixed;right:max(18px,calc(50% - 342px));bottom:calc(20px + env(safe-area-inset-bottom,0px));border:0;background:var(--ink);color:var(--bg);padding:15px 22px;border-radius:18px;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.22)}
.empty-state{color:var(--muted);margin-top:30px}
.tools{display:flex;gap:16px;margin-top:40px;font-size:.86rem}
.tools button{background:none;border:0;color:var(--muted);padding:0;text-decoration:underline;text-underline-offset:3px}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gear{border:0;background:var(--chip);border-radius:12px;width:42px;height:42px;font-size:1.15rem;margin-top:14px;flex:none}
.status{font-size:.8rem;color:var(--muted);margin-top:8px;min-height:1em}
/* dialogs */
dialog{border:0;padding:0;border-radius:24px 24px 0 0;width:100%;max-width:720px;margin:auto auto 0;background:var(--surface);color:var(--ink);max-height:92dvh}
dialog::backdrop{background:rgba(8,12,18,.55)}
@media (min-width:760px){dialog{border-radius:24px;margin:auto}}
form{padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
.dlg-head{display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}
form h3{font:800 1.5rem/1.05 "Bricolage Grotesque",sans-serif;margin:0;letter-spacing:-0.02em}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr}
label{display:grid;gap:4px;font-size:.84rem;color:var(--muted)}
label input,label select,label textarea{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font-size:1rem;width:100%}
textarea.q{font:italic 1.15rem/1.4 "Newsreader",Georgia,serif;min-height:96px;resize:vertical}
textarea{min-height:60px;resize:vertical}
.hint{font-size:.78rem;color:var(--muted);margin:-4px 0 0}
.actions{display:flex;gap:8px;align-items:center;margin-top:6px}
.btn{border:0;padding:12px 18px;border-radius:12px;font-weight:600}
.primary{background:var(--ink);color:var(--bg)}
.ghost{background:var(--chip)}
.del{background:none;color:var(--danger);padding-left:0}
.picklist{display:grid;gap:8px}
.pick{display:flex;align-items:center;gap:12px;border:0;border-radius:14px;padding:12px 14px;color:#fff;text-align:left;font:700 1.15rem "Bricolage Grotesque",sans-serif}
.pick small{font:400 .8rem "IBM Plex Sans",sans-serif;opacity:.85;margin-left:auto}
.pick.plain{background:var(--chip);color:var(--ink)}
.auto{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-weight:500;text-align:left}
.auto[disabled]{opacity:.6}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<button class="fab" id="fab" type="button">+ Agregar escena</button>
<div class="toast" id="toast" role="status" hidden><span></span><button type="button">Deshacer</button></div>

<dialog id="pickDlg"><form method="dialog" id="pickForm">
  <h3>¿De qué serie o película?</h3>
  <div class="picklist" id="pickList"></div>
  <div class="actions"><span style="flex:1"></span><button type="button" class="btn ghost" data-close>Cancelar</button></div>
</form></dialog>

<dialog id="seriesDlg"><form id="seriesForm">
  <h3 id="seriesTitle">Nueva serie o película</h3>
  <label>Nombre<input name="name" required autocomplete="off" placeholder="Breaking Bad"></label>
  <div class="row">
    <label>Tipo<select name="kind"><option value="serie">Serie</option><option value="pelicula">Película</option></select></label>
    <label>Plataforma<input name="platform" list="platList" placeholder="Netflix">
      <datalist id="platList"><option>Netflix</option><option>Prime Video</option><option>Disney+</option><option>Max</option><option>Apple TV+</option><option>Cine</option></datalist></label>
  </div>
  <div id="seasonsBlock" style="display:grid;gap:10px">
    <label>Episodios por temporada<input name="seasons" placeholder="12, 16, 16, 16" inputmode="numeric"></label>
    <p class="hint" id="seasonsHint">Un número por temporada, separados por comas. Puedes copiarlos de la ficha de la serie.</p>
  </div>
  <div class="actions"><span style="flex:1"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn primary">Guardar</button></div>
</form></dialog>

<dialog id="settingsDlg"><form id="settingsForm">
  <h3>Conexión con GitHub</h3>
  <p class="hint" style="margin:0">Repo: <b id="stRepo"></b></p>
  <label>Token de GitHub<input name="token" type="password" autocomplete="off" placeholder="github_pat_…"></label>
  <p class="hint">Fine-grained token con acceso solo a este repo y permiso <b>Contents: Read and write</b>. Se guarda únicamente en este navegador.</p>
  <p class="dest" id="stMsg"></p>
  <div class="actions"><button type="button" class="btn del" id="clearToken">Quitar token</button><span style="flex:1"></span><button type="button" class="btn ghost" data-close>Cancelar</button><button type="submit" class="btn primary">Conectar</button></div>
</form></dialog>

<dialog id="clipDlg"><form id="clipForm">
  <div class="dlg-head"><span class="dot" id="clipDot"></span><h3 id="clipTitle">Suits</h3></div>
  <div class="row" id="epRow"></div>
  <div class="row">
    <label>Inicio<input name="start" placeholder="39:50" inputmode="numeric" required></label>
    <label>Fin<input name="end" placeholder="42:37" inputmode="numeric"></label>
  </div>
  <label>La frase<textarea name="quote" class="q" placeholder="Escribe lo que dicen en la escena"></textarea></label>
  <label>Etiqueta<input name="label" placeholder="Lealtad" required></label>
  <label>Nota personal (opcional)<input name="note" placeholder="Por qué te gusta, quién la dice…"></label>
  <p class="dest" id="dest"></p>
  <div class="actions">
    <button type="button" class="btn del" id="delBtn" hidden>Eliminar</button>
    <span style="flex:1"></span>
    <button type="button" class="btn ghost" data-close>Cancelar</button>
    <button type="submit" class="btn primary">Guardar</button>
  </div>
</form></dialog>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const S = { clips: [], catalog: {}, view: 'home', current: null, q: '', editing: null, ctx: null };

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const toSec = t => { if (!t) return null; const p = String(t).trim().split(':').map(Number); return p.some(isNaN) ? null : p.reduce((a,b)=>a*60+b,0); };
  const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const hue = name => { let h = 0; for (const ch of name.toLowerCase()) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };
  const color = name => `hsl(${hue(name)} 52% 42%)`;
  const grad = name => { const h = hue(name); return `linear-gradient(155deg,hsl(${h} 58% 44%),hsl(${(h+35)%360} 62% 20%))`; };
  const keyOf = n => n.trim().toLowerCase();

  // ---------- storage: GitHub ----------
  const CFG = (() => {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/);
    const first = location.pathname.split('/').filter(Boolean)[0];
    return { owner: m ? m[1] : 'Moreno-Garcia-Jose-Mauricio', repo: m && first ? first : 'Echo', path: 'echo.json', branch: 'main' };
  })();
  const API = `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${CFG.path}`;
  const TK = 'echo.token', LS = 'echo.cache';
  const getToken = () => { try { return localStorage.getItem(TK) || ''; } catch { return ''; } };
  const setToken = t => { try { t ? localStorage.setItem(TK, t) : localStorage.removeItem(TK); } catch {} };
  const lsLoad = () => { try { const d = JSON.parse(localStorage.getItem(LS)); if (d) applyData(d); } catch {} };
  const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify({ clips: S.clips, catalog: S.catalog })); } catch {} };
  const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, '')), c => c.charCodeAt(0)));
  const b64e = s => { let bin = ''; new TextEncoder().encode(s).forEach(x => bin += String.fromCharCode(x)); return btoa(bin); };
  const gh = (t, extra = {}) => ({ Authorization: 'Bearer ' + t, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...extra });
  function applyData(d) { S.clips = Array.isArray(d.clips) ? d.clips.slice() : []; S.catalog = d.catalog ? JSON.parse(JSON.stringify(d.catalog)) : {}; }

  async function fetchRemote() {
    const t = getToken();
    if (t) {
      const r = await fetch(`${API}?ref=${CFG.branch}&t=${Date.now()}`, { headers: gh(t), cache: 'no-store' });
      if (r.status === 401 || r.status === 403) throw new Error('token');
      if (r.status === 404) return { data: { clips: [], catalog: {} }, sha: undefined };
      if (!r.ok) throw new Error('http');
      const j = await r.json();
      return { data: JSON.parse(b64d(j.content)), sha: j.sha };
    }
    const r = await fetch(`${CFG.path}?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('http');
    return { data: await r.json(), sha: null };
  }

  async function commit(mutate, message) {
    const t = getToken();
    if (!t) { openSettings('Para guardar cambios conecta tu token de GitHub.'); throw new Error('notoken'); }
    setSync('Guardando en GitHub…');
    for (let attempt = 0; attempt < 3; attempt++) {
      const { data, sha } = await fetchRemote();
      data.clips ||= []; data.catalog ||= {};
      mutate(data);
      const body = { message, content: b64e(JSON.stringify(data, null, 2) + '\n'), branch: CFG.branch };
      if (sha) body.sha = sha;
      const r = await fetch(API, { method: 'PUT', headers: gh(t, { 'Content-Type': 'application/json' }), body: JSON.stringify(body) });
      if (r.ok) { applyData(data); lsSave(); render(); setSync('Guardado en GitHub'); setTimeout(() => S.syncMsg === 'Guardado en GitHub' && setSync(''), 3000); return; }
      if (r.status === 401 || r.status === 403) { setSync('Tu token no tiene permiso. Revísalo en ⚙'); throw new Error('token'); }
      if (r.status !== 409 && r.status !== 422) break;
    }
    setSync('No se pudo guardar. Revisa tu conexión.');
    throw new Error('save');
  }

  const describe = c => `${c.show}${c.kind === 'pelicula' ? '' : ` T${c.season}E${c.episode}`}, ${c.label}`;
  async function saveClip(c) {
    const isNew = !S.clips.some(x => x.id === c.id);
    return commit(d => { const i = d.clips.findIndex(x => x.id === c.id); i >= 0 ? d.clips[i] = c : d.clips.push(c); },
      `${isNew ? 'Agrega' : 'Actualiza'} escena: ${describe(c)}`);
  }
  async function removeClip(id) {
    const c = S.clips.find(x => x.id === id);
    return commit(d => { d.clips = d.clips.filter(x => x.id !== id); }, `Elimina escena: ${c ? describe(c) : id}`);
  }
  async function saveCatalog() {
    const cat = JSON.parse(JSON.stringify(S.catalog));
    return commit(d => { d.catalog = cat; }, 'Actualiza series');
  }

  async function refresh() {
    try {
      const { data } = await fetchRemote();
      applyData(data); lsSave(); render();
      setSync(getToken() ? '' : 'Solo lectura. Conecta tu token en ⚙ para guardar.');
    } catch (e) {
      setSync(e.message === 'token' ? 'Tu token no funciona. Revísalo en ⚙' : 'Sin conexión. Mostrando la última copia guardada.');
    }
  }

  // ---------- model ----------
  function allSeries() {
    const map = {};
    Object.values(S.catalog).forEach(s => map[keyOf(s.name)] = { ...s });
    S.clips.forEach(c => { const k = keyOf(c.show); if (!map[k]) map[k] = { name: c.show, kind: c.kind || 'serie', platform: c.platform || '', seasons: null }; });
    return Object.values(map).sort((a,b) => a.name.localeCompare(b.name,'es'));
  }
  const seriesBy = name => allSeries().find(s => keyOf(s.name) === keyOf(name));
  const clipsOf = name => S.clips.filter(c => keyOf(c.show) === keyOf(name))
    .sort((a,b)=>(a.season||0)-(b.season||0)||(a.episode||0)-(b.episode||0)||(toSec(a.start)||0)-(toSec(b.start)||0));

  // ---------- views ----------
  function render() {
    const app = $('#app');
    if (S.view === 'series' && S.current && seriesBy(S.current)) renderSeries(app); else { S.view = 'home'; renderHome(app); }
    updateFab();
  }

  function renderHome(app) {
    const series = allSeries();
    const n = S.clips.length;
    app.innerHTML = `
      <div class="head"><h1>Echo</h1><button class="gear" id="gearBtn" type="button" aria-label="Conexión con GitHub">⚙</button></div>
      <p class="sub">${n ? `${n} ${n===1?'escena':'escenas'} en ${series.length} ${series.length===1?'título':'títulos'}` : 'Tus frases favoritas, con el minuto exacto'}</p>
      <div class="search"><input id="q" type="search" placeholder="Buscar una frase, etiqueta o serie" value="${esc(S.q)}" aria-label="Buscar"></div>
      <div id="body"></div>
      <div class="tools"><button id="exportBtn" type="button">Exportar respaldo</button><button id="importBtn" type="button">Importar respaldo</button><input id="importFile" type="file" accept="application/json" hidden></div>
      <p class="status" id="sync">${esc(S.syncMsg || '')}</p>`;
    const body = $('#body');
    if (S.q.trim()) {
      const q = S.q.toLowerCase();
      const hits = S.clips.filter(c => [c.show,c.label,c.quote,c.note,c.episodeTitle].join(' ').toLowerCase().includes(q));
      body.innerHTML = hits.length ? '<div style="margin-top:18px"></div>' : '<p class="empty-state">Ninguna escena coincide.</p>';
      hits.forEach(c => body.firstChild && body.appendChild(card(c, true)));
    } else {
      const grid = document.createElement('div'); grid.className = 'grid';
      series.forEach(s => {
        const cs = clipsOf(s.name);
        const b = document.createElement('button'); b.type='button'; b.className='poster'; b.style.background = grad(s.name);
        const seasonsTxt = s.kind==='pelicula' ? 'Película' : s.seasons ? `${s.seasons.length} ${s.seasons.length===1?'temporada':'temporadas'}` : 'Serie';
        b.innerHTML = `<span class="big">${cs.length}</span><span class="t">${esc(s.name)}</span><span class="m">${cs.length} ${cs.length===1?'escena':'escenas'}, ${seasonsTxt}</span>`;
        b.onclick = () => openSeries(s.name);
        grid.appendChild(b);
      });
      const nb = document.createElement('button'); nb.type='button'; nb.className='poster new';
      nb.innerHTML = '<span class="t">+ Nueva serie<br>o película</span>'; nb.onclick = () => openSeriesForm();
      grid.appendChild(nb);
      body.appendChild(grid);
    }
    const qi = $('#q'); qi.oninput = e => { S.q = e.target.value; const pos = e.target.selectionStart; render(); const n2 = $('#q'); n2.focus(); n2.setSelectionRange(pos,pos); };
    wireTools();
  }

  function renderSeries(app) {
    const s = seriesBy(S.current), cs = clipsOf(s.name), c = color(s.name);
    const total = s.seasons ? s.seasons.reduce((a,b)=>a+b,0) : 0;
    app.innerHTML = `
      <div class="topbar"><button class="back" id="backBtn" type="button">‹ Todas</button></div>
      <section class="hero" style="background:${grad(s.name)}">
        <button class="edit" id="editSeries" type="button">Editar</button>
        <h2>${esc(s.name)}</h2>
        <p>${[s.platform, s.kind==='pelicula' ? 'Película' : s.seasons ? `${s.seasons.length} temporadas, ${total} episodios` : 'Serie', `${cs.length} ${cs.length===1?'escena guardada':'escenas guardadas'}`].filter(Boolean).join('  /  ')}</p>
      </section>
      <div id="mapBox"></div>
      <div id="cards"></div>
      <p class="status" id="sync">${esc(S.syncMsg || '')}</p>`;
    $('#backBtn').onclick = () => { S.view='home'; S.current=null; S.sel=null; render(); scrollTo(0,0); };
    $('#editSeries').onclick = () => openSeriesForm(s);

    const mapBox = $('#mapBox');
    if (s.kind !== 'pelicula') {
      if (s.seasons) {
        const has = {}; cs.forEach(x => { const k = `${x.season}-${x.episode}`; has[k] = (has[k]||0)+1; });
        let html = '<div class="map"><h3>Mapa de episodios</h3>';
        s.seasons.forEach((eps,i) => {
          const sn = i+1;
          html += `<div class="srow"><b>T${sn}</b><div class="cells">`;
          for (let e=1;e<=eps;e++) { const on = has[`${sn}-${e}`]; html += `<button type="button" class="cell${on?' on':''}${S.sel&&S.sel.season===sn&&S.sel.episode===e?' sel':''}" style="--c:${c}" data-s="${sn}" data-e="${e}" aria-label="Temporada ${sn}, episodio ${e}${on?`, ${on} escena${on>1?'s':''}`:''}">${e}</button>`; }
          html += '</div></div>';
        });
        html += '<p class="legend">Toca un episodio vacío para marcarlo y luego “Agregar”. Uno de color te lleva a su escena.</p></div>';
        mapBox.innerHTML = html;
        mapBox.querySelectorAll('.cell').forEach(b => b.onclick = () => {
          const sn = +b.dataset.s, e = +b.dataset.e;
          if (b.classList.contains('on')) {
            const el = document.getElementById(`ep-${sn}-${e}`);
            if (el) { el.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
          } else {
            S.sel = S.sel && S.sel.season === sn && S.sel.episode === e ? null : { season: sn, episode: e };
            mapBox.querySelectorAll('.cell.sel').forEach(x => x.classList.remove('sel'));
            if (S.sel) b.classList.add('sel');
            updateFab();
          }
        });
      } else {
        mapBox.innerHTML = `<div class="map nomap">Aún no tengo las temporadas de esta serie. <button type="button" id="addSeasons">Agregarlas</button> para elegir temporada y episodio de una lista.</div>`;
        $('#addSeasons').onclick = () => openSeriesForm(s);
      }
    }

    const box = $('#cards');
    if (!cs.length) { box.innerHTML = '<p class="empty-state">Todavía no hay escenas. Toca “Agregar escena”.</p>'; return; }
    let last = null;
    box.insertAdjacentHTML('beforeend','<h3 class="section-h" style="margin-top:26px">Escenas</h3>');
    cs.forEach(x => {
      if (s.kind !== 'pelicula' && x.season !== last) { last = x.season; box.insertAdjacentHTML('beforeend', `<div class="season-h">Temporada ${x.season ?? '?'}</div>`); }
      box.appendChild(card(x, false));
    });
  }

  function card(x, showName) {
    const c = color(x.show), s = toSec(x.start), e = toSec(x.end);
    const span = Math.max(e || s || 0, 45*60);
    const left = s!=null ? s/span*100 : 0, width = s!=null&&e!=null ? Math.max((e-s)/span*100,1.2) : 1.2;
    const dur = s!=null && e!=null && e>s ? ` (${fmt(e-s)})` : '';
    const where = (x.kind==='pelicula' ? 'Película' : `T${x.season ?? '?'} E${x.episode ?? '?'}`) + (x.episodeTitle ? `, <i>${esc(x.episodeTitle)}</i>` : '');
    const el = document.createElement('article'); el.className='card'; el.style.setProperty('--c', c);
    if (x.kind!=='pelicula') el.id = el.id || `ep-${x.season}-${x.episode}`;
    if (document.getElementById(el.id)) el.removeAttribute('id');
    el.innerHTML = `
      <div class="card-top"><span class="tag">${esc(x.label)}</span><span class="ep">${showName?`<span class="show-name">${esc(x.show)}</span>  `:''}${where}</span><button class="icon" type="button" aria-label="Editar escena">✎</button></div>
      ${x.quote ? `<p class="quote">${esc(x.quote)}</p>` : `<p class="quote empty">Sin frase todavía. Toca ✎ para escribirla.</p>`}
      ${x.note ? `<p class="note">${esc(x.note)}</p>` : ''}
      <div class="time"><span>${esc(x.start)}${x.end?'–'+esc(x.end):''}${dur}</span><span class="bar" aria-hidden="true"><i style="left:${left}%;width:${width}%"></i></span></div>`;
    el.querySelector('.icon').onclick = () => openClipForm(x.show, x);
    return el;
  }

  function openSeries(name) { S.view='series'; S.current=name; S.q=''; S.sel=null; render(); scrollTo(0,0); }

  // ---------- pick dialog ----------
  $('#fab').onclick = () => {
    if (S.view === 'series') return openClipForm(S.current, null, S.sel || undefined);
    const list = $('#pickList'); list.innerHTML = '';
    allSeries().forEach(s => {
      const b = document.createElement('button'); b.type='button'; b.className='pick'; b.style.background = grad(s.name);
      b.innerHTML = `${esc(s.name)}<small>${clipsOf(s.name).length} escenas</small>`;
      b.onclick = () => { $('#pickDlg').close(); openClipForm(s.name); };
      list.appendChild(b);
    });
    const nb = document.createElement('button'); nb.type='button'; nb.className='pick plain'; nb.textContent = '+ Nueva serie o película';
    nb.onclick = () => { $('#pickDlg').close(); openSeriesForm(null, true); };
    list.appendChild(nb);
    $('#pickDlg').showModal();
  };
  document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => tryClose(b.closest('dialog')));
  $('#clipDlg').addEventListener('cancel', e => { e.preventDefault(); tryClose($('#clipDlg')); });

  // ---------- series form ----------
  const sf = $('#seriesForm');
  let sfEditing = null, sfThenClip = false;
  function syncSeriesKind() { $('#seasonsBlock').style.display = sf.kind.value === 'pelicula' ? 'none' : 'grid'; }
  sf.kind.onchange = syncSeriesKind;
  function openSeriesForm(s, thenClip) {
    sfEditing = s || null; sfThenClip = !!thenClip;
    sf.reset();
    $('#seriesTitle').textContent = s ? `Editar ${s.name}` : 'Nueva serie o película';
    sf.name.value = s?.name || ''; sf.kind.value = s?.kind || 'serie'; sf.platform.value = s?.platform ?? 'Netflix';
    sf.seasons.value = s?.seasons ? s.seasons.join(', ') : '';
    $('#seasonsHint').textContent = 'Un número por temporada, separados por comas. Puedes copiarlos de la ficha de la serie.';
    syncSeriesKind(); $('#seriesDlg').showModal();
  }
  sf.onsubmit = async ev => {
    ev.preventDefault();
    const name = sf.name.value.trim(); if (!name) return;
    const kind = sf.kind.value;
    const seasons = kind === 'pelicula' ? null : (sf.seasons.value.match(/\d+/g) || []).map(Number).filter(n => n > 0);
    const old = sfEditing ? keyOf(sfEditing.name) : null;
    if (old && old !== keyOf(name)) {
      delete S.catalog[old];
      for (const c of clipsOf(sfEditing.name)) await saveClip({ ...c, show: name });
    }
    S.catalog[keyOf(name)] = { name, kind, platform: sf.platform.value.trim(), seasons: seasons && seasons.length ? seasons : null };
    try { await saveCatalog(); } catch { setStatus('No se pudo guardar la serie.'); return; }
    $('#seriesDlg').close();
    S.view = 'series'; S.current = name; render();
    if (sfThenClip) openClipForm(name);
  };

  // ---------- clip form ----------
  const cf = $('#clipForm');
  function buildEpRow(s, season, episode) {
    const row = $('#epRow');
    if (s.kind === 'pelicula') { row.innerHTML = ''; row.hidden = true; return; }
    row.hidden = false;
    if (s.seasons) {
      const sn = season && season <= s.seasons.length ? season : null;
      row.innerHTML = `<label>Temporada<select name="season" required><option value="">Elige…</option>${s.seasons.map((_,i)=>`<option value="${i+1}"${i+1===sn?' selected':''}>Temporada ${i+1}</option>`).join('')}</select></label>
        <label>Episodio<select name="episode" required></select></label>`;
      const taken = ep => clipsOf(s.name).some(c => c.season == cf.season.value && c.episode == ep) ? ' (ya tiene escena)' : '';
      const fillEps = (keep) => {
        const n = cf.season.value ? s.seasons[cf.season.value-1] : 0;
        cf.episode.innerHTML = `<option value="">${n ? 'Elige…' : 'Primero la temporada'}</option>` + Array.from({length:n},(_,i)=>`<option value="${i+1}">Episodio ${i+1}${taken(i+1)}</option>`).join('');
        cf.episode.value = keep && keep <= n ? keep : '';
        updateDest();
      };
      fillEps(episode); cf.season.onchange = () => fillEps(null);
    } else {
      row.innerHTML = `<label>Temporada<input name="season" type="number" min="1" required inputmode="numeric" value="${season??''}"></label>
        <label>Episodio<input name="episode" type="number" min="1" required inputmode="numeric" value="${episode??''}"></label>`;
    }
  }
  function openClipForm(showName, clip, preset) {
    const s = seriesBy(showName) || { name: showName, kind: 'serie', seasons: null };
    S.editing = clip || null; S.ctx = s;
    cf.reset();
    $('#clipTitle').textContent = clip ? `Editar escena de ${s.name}` : s.name;
    $('#clipDot').style.setProperty('--c', color(s.name));
    $('#delBtn').hidden = !clip;
    const lastOfShow = clipsOf(s.name).slice(-1)[0];
    buildEpRow(s, clip?.season ?? preset?.season ?? null, clip?.episode ?? preset?.episode ?? null);
    if (clip) ['start','end','quote','label','note'].forEach(k => cf[k].value = clip[k] || '');
    cfInitial = formVals(); updateDest();
    $('#clipDlg').showModal();
    setTimeout(() => { if (clip) cf.quote.focus(); else if (preset) cf.start.focus(); }, 50);
  }
  $('#delBtn').onclick = async () => {
    if (!S.editing || !confirm(`¿Eliminar “${S.editing.label}”?`)) return;
    const gone = { ...S.editing };
    try { await removeClip(gone.id); $('#clipDlg').close(); toast('Escena eliminada', () => saveClip(gone)); } catch { setStatus('No se pudo eliminar.'); }
  };
  cf.onsubmit = async ev => {
    ev.preventDefault();
    const okT = v => /^\d{1,2}(:[0-5]\d){1,2}$/.test(v.trim());
    const bad = (el, msg) => { el.focus(); el.setCustomValidity(msg); el.reportValidity(); setTimeout(() => el.setCustomValidity(''), 0); };
    if (!okT(cf.start.value)) return bad(cf.start, 'Escribe el inicio como mm:ss, por ejemplo 39:50');
    if (cf.end.value.trim() && (!okT(cf.end.value) || toSec(cf.end.value) <= toSec(cf.start.value))) return bad(cf.end, 'El fin debe ir como mm:ss y ser después del inicio');
    const s = S.ctx, film = s.kind === 'pelicula';
    const num = v => v === '' || v == null ? null : Number(v);
    const c = {
      id: S.editing?.id || 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
      show: s.name, kind: film ? 'pelicula' : 'serie', platform: s.platform || S.editing?.platform || '',
      season: film ? null : num(cf.season?.value), episode: film ? null : num(cf.episode?.value),
      start: cf.start.value.trim(), end: cf.end.value.trim(),
      quote: cf.quote.value.trim(), label: cf.label.value.trim(), note: cf.note.value.trim(),
      createdAt: S.editing?.createdAt || Date.now()
    };
    if (S.editing?.episodeTitle && S.editing.season === c.season && S.editing.episode === c.episode) c.episodeTitle = S.editing.episodeTitle;
    const prev = S.editing ? { ...S.editing } : null;
    try {
      await saveClip(c); $('#clipDlg').close(); S.sel = null;
      if (S.view !== 'series') { S.view='series'; S.current=s.name; }
      render();
      const where = film ? s.name : `T${c.season} E${c.episode}`;
      toast(prev ? `Escena actualizada (${where})` : `Guardada en ${where}`, () => prev ? saveClip(prev) : removeClip(c.id));
    }
    catch (e) { if (e.message === 'http') setStatus('No se pudo guardar. Intenta de nuevo.'); }
  };

  // ---------- tools ----------
  function setSync(t) { S.syncMsg = t; const el = $('#sync'); if (el) el.textContent = t; }
  function setStatus(t) { setSync(t); }
  let cfInitial = '';
  function formVals() { return ['season','episode','start','end','quote','label','note'].map(k => cf[k]?.value || '').join('|'); }
  function tryClose(d) {
    if (d.id === 'clipDlg' && formVals() !== cfInitial && !confirm('¿Descartar los cambios de esta escena?')) return;
    d.close();
  }
  function updateFab() {
    $('#fab').textContent = S.view === 'series' && S.sel ? `+ Agregar en T${S.sel.season} E${S.sel.episode}` : '+ Agregar escena';
  }
  function updateDest() {
    const s = S.ctx, el = $('#dest'); if (!s || !el) return;
    if (s.kind === 'pelicula') { el.textContent = `Se guardará en ${s.name}`; el.classList.remove('warn'); return; }
    const se = cf.season?.value, ep = cf.episode?.value;
    el.textContent = se && ep ? `Se guardará en ${s.name}, temporada ${se}, episodio ${ep}` : 'Falta elegir temporada y episodio';
    el.classList.toggle('warn', !(se && ep));
  }
  cf.addEventListener('input', updateDest);
  function toast(msg, undo) {
    const t = $('#toast'), b = t.querySelector('button');
    t.querySelector('span').textContent = msg;
    b.hidden = !undo;
    b.onclick = async () => { t.hidden = true; try { await undo(); } catch { setStatus('No se pudo deshacer.'); } };
    t.hidden = false; clearTimeout(toast.timer); toast.timer = setTimeout(() => t.hidden = true, 6000);
  }
  function wireTools() {
    $('#gearBtn').onclick = () => openSettings();
    $('#exportBtn').onclick = () => {
      const blob = new Blob([JSON.stringify({ clips: S.clips, catalog: S.catalog }, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'echo.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    };
    $('#importBtn').onclick = () => $('#importFile').click();
    $('#importFile').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      try {
        const d = JSON.parse(await f.text());
        const clips = (Array.isArray(d) ? d : d.clips || []).filter(c => c?.id && c?.show);
        await commit(r => {
          if (d.catalog) Object.assign(r.catalog, d.catalog);
          clips.forEach(c => { const i = r.clips.findIndex(x => x.id === c.id); i >= 0 ? r.clips[i] = c : r.clips.push(c); });
        }, `Importa respaldo (${clips.length} escenas)`);
      } catch (err) { if (err.message !== 'notoken' && err.message !== 'token') setStatus('Ese archivo no es un respaldo válido.'); }
      e.target.value = '';
    };
  }

  // ---------- settings ----------
  const stDlg = $('#settingsDlg'), stForm = $('#settingsForm');
  function openSettings(msg) {
    stForm.token.value = getToken();
    $('#stMsg').textContent = msg || (getToken() ? 'Conectado. Cada cambio se guarda como un commit.' : 'Sin token, la app solo puede leer.');
    $('#stRepo').textContent = `${CFG.owner}/${CFG.repo}`;
    $('#clearToken').hidden = !getToken();
    stDlg.showModal();
  }
  stForm.onsubmit = async ev => {
    ev.preventDefault();
    const t = stForm.token.value.trim(); if (!t) return;
    $('#stMsg').textContent = 'Probando conexión…';
    try {
      const r = await fetch(`https://api.github.com/repos/${CFG.owner}/${CFG.repo}`, { headers: gh(t) });
      const j = r.ok ? await r.json() : null;
      if (!j) throw 0;
      if (j.permissions && !j.permissions.push) { $('#stMsg').textContent = 'El token puede leer pero no escribir. Dale permiso Contents: Read and write.'; return; }
      setToken(t); stDlg.close(); refresh();
    } catch { $('#stMsg').textContent = 'Ese token no abre el repo. Revisa que incluya el repo y el permiso Contents.'; }
  };
  $('#clearToken').onclick = () => { setToken(''); stDlg.close(); refresh(); };

  // ---------- boot ----------
  lsLoad(); render(); refresh();
})();
</script>
</body>
</html>
